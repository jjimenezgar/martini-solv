name: Scientific environment
on:
  workflow_dispatch:
  push:
    paths:
      - environment.yml
      - martini_solv/builder.py
      - .github/workflows/environment.yml
jobs:
  install-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-environment: true
      - name: Confirm scientific executables and Python packages
        shell: micromamba-shell {0}
        run: |
          python -c "import streamlit, rdkit, mdtraj, vermouth, insane, martini_mapper"
          martinize2 --version
          gmx --version
          insane --help > /dev/null
      - name: Test Martini Mapper output
        shell: micromamba-shell {0}
        run: |
          python -m martini_mapper Benzene c1ccccc1 --no-xtb --out-dir /tmp/benzene
          test -s /tmp/benzene/Benzene.gro
          test -s /tmp/benzene/Benzene.itp
      - name: Python tests
        shell: micromamba-shell {0}
        run: python -m unittest discover -s tests -v
      - name: Build 1UBQ in Martini water and verify GROMACS input
        shell: micromamba-shell {0}
        run: |
          curl -fLsS https://files.rcsb.org/download/1UBQ.pdb -o /tmp/1ubq.pdb
          python -m martini_solv.cli --pdb /tmp/1ubq.pdb --out /tmp/ubq-system --solvent water --salt 0.15 || {
            tail -n 120 /tmp/ubq-system.incomplete/build.log
            exit 1
          }
          test -s /tmp/ubq-system/system.gro
          test -s /tmp/ubq-system/system.top
          test -s /tmp/ubq-system/minimization.tpr
